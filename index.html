<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80-20 학습 포탈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --navy:#1E3A5F; --blue:#2563EB; --blue-h:#1d4ed8; --sky:#4A90D9;
    --bg:#f5f7fa; --card:#ffffff; --line:#d4dbe6;
    --ink:#1e2a3a; --sub:#3d4f63; --mute:#3d4f63;
    --green:#059669; --amber:#D97706; --red:#DC2626;
  }
  body{ font-family:'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
        background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
        -webkit-text-size-adjust:100%; }
  .app{ max-width:900px; margin:0 auto; padding:20px 18px 60px; }

  .head{ margin-bottom:14px; }
  .head h1{ font-size:22px; font-weight:900; color:var(--navy); letter-spacing:-0.4px; }
  .head .sub{ font-size:13px; color:var(--sub); margin-top:2px; }

  .tabs{ display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap; }
  .tab{ font-family:inherit; font-size:13px; font-weight:700; color:var(--sub);
        background:#fff; border:1px solid var(--line); border-radius:999px;
        padding:7px 14px; cursor:pointer; }
  .tab.on{ background:var(--blue); border-color:var(--blue); color:#fff; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:18px; margin-bottom:14px; }
  .card > h2:first-child{ background:#eef4ff; color:var(--navy); font-size:15px; font-weight:800;
         margin:-18px -18px 14px; padding:13px 18px 11px; border-radius:13px 13px 0 0;
         border-bottom:1px solid #dbe7fb; }
  h2{ font-size:15px; font-weight:800; color:var(--navy); }
  h3{ font-size:13px; font-weight:800; color:var(--sub); margin:16px 0 6px; }
  .muted{ color:var(--sub); font-size:13px; }

  .kids{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .kid{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .kid .nm{ font-size:17px; font-weight:900; color:var(--navy); }
  .kid .co{ font-size:12px; color:var(--sub); margin-top:1px; }
  .kid .row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pill{ font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 9px;
         background:#f1f5fb; color:var(--sub); border:1px solid #e2e9f4; }
  .pill.d{ background:#eef4ff; color:var(--blue); border-color:#dbe7fb; }

  .btn{ font-family:inherit; font-size:14px; font-weight:800; color:#fff; background:var(--blue);
        border:0; border-radius:10px; padding:11px 18px; cursor:pointer; }
  .btn:hover{ background:var(--blue-h); }
  .btn.ghost{ background:#fff; color:var(--blue); border:1px solid #c7d7f5; }
  .btn.mini{ font-size:12px; padding:7px 12px; border-radius:8px; }
  .btn.wide{ width:100%; margin-top:12px; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 4px; }
  .kpi{ background:#f8fbff; border:1px solid #dbe7fb; border-radius:12px; padding:12px; text-align:center; }
  .kpi .v{ font-size:21px; font-weight:900; color:var(--blue); }
  .kpi .k{ font-size:11.5px; color:var(--sub); margin-top:2px; }

  .state{ font-size:13.5px; font-weight:700; padding:11px 13px; border-radius:10px;
          background:#f1f5fb; border:1px solid #e2e9f4; margin-top:12px; }
  .state.good{ background:#eefaf3; border-color:#c9ecdb; color:#0a6b48; }
  .state.warn{ background:#fff8ec; border-color:#f0d6a8; color:#8a5a06; }
  .state.bad{ background:#fdf1f1; border-color:#f2cccc; color:#a02525; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ background:var(--navy); color:#fff; font-weight:700; padding:8px 10px; text-align:left;
      font-size:12px; }
  td{ padding:9px 10px; border-bottom:1px solid #eef1f6; vertical-align:top; }
  tr:nth-child(even) td{ background:#f8fafd; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  /* 좁은 화면에서 표가 눌리지 않게 가로 스와이프 허용(부모 팁이 길어질 수 있음) */
  .tblwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tblwrap table{ min-width:520px; }

  ul.guide{ list-style:none; }
  ul.guide li{ font-size:13px; color:var(--sub); padding-left:14px; position:relative; margin-bottom:6px; }
  ul.guide li::before{ content:''; position:absolute; left:2px; top:9px; width:4px; height:4px;
                       border-radius:2px; background:var(--sky); }

  .inp{ font-family:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
        border-radius:9px; background:#fff; color:var(--ink); width:100%; }
  .frow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .frow > *{ flex:0 0 auto; }
  .frow .inp{ flex:1 1 auto; }
  textarea.inp{ min-height:88px; resize:vertical; font-size:12px; }

  .hidden{ display:none !important; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
          background:var(--navy); color:#fff; font-size:13px; font-weight:700;
          padding:11px 18px; border-radius:10px; opacity:0; transition:opacity .2s;
          pointer-events:none; z-index:50; }
  .toast.on{ opacity:1; }

  @media (max-width:640px){
    .app{ padding:14px 12px 50px; }
    .head h1{ font-size:19px; }
    .kids{ grid-template-columns:1fr; }
    .kpis{ grid-template-columns:1fr 1fr; }
    .card{ padding:15px; }
    .card > h2:first-child{ margin:-15px -15px 12px; padding:12px 15px 10px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <h1>80-20 학습 포탈</h1>
    <div class="sub">아이는 15문항씩 학습, 부모는 진척과 준비사항 확인</div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="kids" onclick="go('kids')">오늘 학습</button>
    <button class="tab" data-t="parent" onclick="go('parent')">부모 리포트</button>
    <button class="tab" data-t="set" onclick="go('set')">설정</button>
  </div>

  <div id="sc-kids"></div>
  <div id="sc-parent" class="hidden"></div>
  <div id="sc-set" class="hidden"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CAT = {"social":{"id":"social","name":"중1 사회 Ⅰ·Ⅱ","label":"중1 사회","page":"social.html","store":"sr8020","nConcept":26,"nQuestion":156,"guide":["주 3회, 한 번에 15문항이 기본입니다. 길게 한 번보다 짧게 여러 번이 효과적입니다.","세션 끝에 나오는 '자기 전 5분 카드' 3개를 같이 훑어주세요. 하루의 오차가 잠자는 동안 굳습니다.","지도·뉴스·여행 사진처럼 실제 자료를 함께 보면 개념이 오래 남습니다.","정답률이 85% 언저리일 때가 가장 빨리 배우는 구간입니다. 100%면 너무 쉽고, 60% 아래면 너무 어렵습니다."],"units":[{"name":"Ⅰ. 세계화 시대, 지리의 힘","secs":[{"name":"01. 우리가 살아가는 모자이크 세계","concepts":[{"id":"I-01-1","title":"위치를 읽는 두 가지 눈","tier":1,"tip":"집에서 학교까지 걸어가는 길을 지도 위에 그어 보세요"},{"id":"I-01-2","title":"자연환경과 인문환경","tier":1,"tip":"등굣길에서 본 산·논과 도로·아파트를 나눠 말해 보게 하세요"},{"id":"I-01-3","title":"세계의 자연환경 - 위도가 기후를 가른다","tier":2,"tip":"세계 날씨 앱에서 아산과 싱가포르 기온을 함께 비교해 보세요"},{"id":"I-01-4","title":"모자이크로서의 세계 - 지역 특성 추론하기","tier":2,"tip":"여행 사진 한 장을 위치·날씨·옷차림 순서로 설명해 보게 하세요"}]},{"name":"02. 네트워크로 연결된 세계","concepts":[{"id":"I-02-1","title":"교통의 발달이 거리를 좁힌다","tier":2,"tip":"어제 주문한 택배가 온 시간과 경로를 함께 확인해 보세요"},{"id":"I-02-2","title":"통신의 발달이 만든 네트워크","tier":2,"tip":"해외 유튜브 영상이 어느 나라 서버를 거치는지 알아보세요"},{"id":"I-02-3","title":"스케일을 바꿔 세상 보기","tier":3,"tip":"같은 미세먼지 뉴스를 동네·나라·세계 크기로 나눠 말해 보세요"},{"id":"I-02-4","title":"일상생활과 세계의 연결","tier":2,"tip":"운동화와 옷 라벨의 생산국을 함께 읽고 짚어 주세요"}]},{"name":"03. 서로 영향을 주고받는 역동적인 세계","concepts":[{"id":"I-03-1","title":"세계화와 등질화","tier":2,"tip":"해외 여행 사진에서 익숙한 브랜드 간판을 함께 세어 보세요"},{"id":"I-03-2","title":"지역화 - 세계화 속의 지역","tier":3,"tip":"동네 빵집처럼 우리 동네에만 있는 것을 함께 꼽아 보세요"},{"id":"I-03-3","title":"글로컬 - 지역이 세계를 바꾼다","tier":3,"tip":"한국 음식·가수가 외국에서 인기인 영상을 함께 봐 주세요"},{"id":"I-03-4","title":"세계화 시대에 필요한 지리적 안목","tier":3,"tip":"가족 여행 계획을 세우며 갈 곳을 종이에 그려 보게 하세요"}]}]},{"name":"Ⅱ. 아시아","secs":[{"name":"01. 아시아의 여러 국가와 자연환경","concepts":[{"id":"II-01-1","title":"아시아의 범위와 다섯 지역","tier":1,"tip":"알고 있는 아시아 나라를 다섯 지역으로 함께 분류해 보세요"},{"id":"II-01-2","title":"아시아의 여러 국가와 주요 도시","tier":1,"tip":"뉴스에 나온 나라의 수도를 함께 검색해 짝지어 보세요"},{"id":"II-01-3","title":"아시아의 지형 - 가장 높고 가장 낮은 대륙","tier":2,"tip":"에베레스트와 사해 높이를 검색해 높낮이를 비교해 보세 const META = {"title":"80-20 학습 포탈","sub":"아이는 15문항씩 학습, 부모는 진척과 준비사항 확인","version":"hub-v1"};
const HUBKEY = 's8020_hub_v1';
const OLD_IDX = 'sr8020_index_v1';
const SEVEN = 7 * 86400000;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.className = 'toast on';
  setTimeout(() => t.className = 'toast', 1800);
}

/* ── 저장 ── */
function loadHub(){
  try{ const r = localStorage.getItem(HUBKEY); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function saveHub(h){ try{ localStorage.setItem(HUBKEY, JSON.stringify(h)); }catch(e){ toast('저장 공간을 쓸 수 없어요'); } }
function newId(){ return 'k' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36); }

/* 첫 실행: 기존 사회 앱 프로필이 있으면 그대로 학습자로 이어받아 기록을 보존한다 */
function ensureHub(){
  let h = loadHub();
  if(h && Array.isArray(h.kids) && h.kids.length) return h;
  const kids = [];
  try{
    const raw = localStorage.getItem(OLD_IDX);
    if(raw){
      const old = JSON.parse(raw);
      (old.profiles || []).forEach(p => kids.push({id:p.id, name:p.name, course:'social', diff:(p.diff|0)||0}));
    }
  }catch(e){}
  kids.push({id:newId(), name:'초4 영어', course:'english', diff:0});
  if(!kids.some(k => k.course === 'social'))
    kids.unshift({id:newId(), name:'중1 사회', course:'social', diff:0});
  h = {v:1, kids:kids, seen:false};
  saveHub(h);
  return h;
}
function courseOf(kid){ return CAT[kid.course] || null; }

/* ── 학습 기록 읽기 (코스 페이지가 쓴 키를 그대로 읽는다) ── */
function stateOf(kid){
  const c = courseOf(kid); if(!c) return null;
  try{ const r = localStorage.getItem(c.store + '_state_v1_' + kid.id); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function flat(course){
  const out = [];
  course.units.forEach(u => u.secs.forEach(s => s.concepts.forEach(x =>
    out.push({id:x.id, title:x.title, tier:x.tier, tip:x.tip, unit:u.name, sec:s.name}))));
  return out;
}
function daysAgo(d){ return (Date.now() - new Date(d + 'T12:00:00').getTime()) / 86400000; }
function rate(ok, n){ return n ? Math.round(ok / n * 100) : null; }
const DIFFS = [{name:'안정', target:0.85}, {name:'도전', target:0.75}, {name:'가속', target:0.65}];

function report(kid){
  const course = courseOf(kid), all = flat(course), S = stateOf(kid);
  const st = (S && S.c) ? S.c : {};
  const sess = (S && S.sess) ? S.sess : [];
  const learned = all.filter(c => st[c.id] && st[c.id].n > 0).length;
  const cumN = all.reduce((a, c) => a + ((st[c.id] && st[c.id].n) || 0), 0);
  const cumOk = all.reduce((a, c) => a + ((st[c.id] && st[c.id].ok) || 0), 0);
  const wk = sess.filter(s => daysAgo(s.d) <= SEVEN);
  const wkN = wk.reduce((a, s) => a + s.n, 0), wkOk = wk.reduce((a, s) => a + s.ok, 0);
  const diff = Math.max(0, Math.min(2, kid.diff | 0)), target = DIFFS[diff].target;

  const weak = all.filter(c => st[c.id] && st[c.id].n >= 2 && st[c.id].ok / st[c.id].n <= 0.65)
    .map(c => ({...c, n:st[c.id].n, acc:rate(st[c.id].ok, st[c.id].n)}))
    .sort((a, b) => a.acc - b.acc || b.n - a.n).slice(0, 3);
  if(weak.length < 3){
    const ids = new Set(weak.map(w => w.id));
    all.filter(c => st[c.id] && st[c.id].n >= 1 && !ids.has(c.id))
      .map(c => ({...c, n:st[c.id].n, acc:rate(st[c.id].ok, st[c.id].n), th:st[c.id].th}))
      .sort((a, b) => a.th - b.th).slice(0, 3 - weak.length).forEach(x => weak.push(x));
  }
  const next = all.filter(c => !(st[c.id] && st[c.id].n > 0))
    .sort((a, b) => a.tier - b.tier).slice(0, 3);

  const diagDone = !!(S && S.diag) || sess.some(s => s.mode === '진단');
  const last = sess.length ? sess[sess.length - 1].d : null;
  let stage = {k:'none', t:'아직 기록이 없어요. 진단 12문항부터 시작하면 출발점을 잡습니다.'};
  if(sess.length){
    if(!diagDone) stage = {k:'warn', t:'진단이 아직 끝나지 않았어요. 진단 12문항을 먼저 끝내면 난이도가 정확해집니다.'};
    else{
      const a = wkN ? wkOk / wkN : cumN ? cumOk / cumN : null;
      if(a == null) stage = {k:'warn', t:'기록이 부족합니다. 한 세션 더 하면 판단할 수 있어요.'};
      else if(a >= target + 0.05) stage = {k:'good', t:'여유가 있어요. ' + Math.round(a*100) + '%로 목표 ' + Math.round(target*100) + '%보다 높습니다. 난이도를 한 단계 올려도 좋습니다.'};
      else if(a <= target - 0.15) stage = {k:'bad', t:'어려워하고 있어요. ' + Math.round(a*100) + '%로 목표 ' + Math.round(target*100) + '%보다 낮습니다. 난이도를 낮추거나 취약 개념을 먼저 정리하는 게 좋습니다.'};
      else stage = {k:'good', t:'딱 좋은 구간입니다. ' + Math.round(a*100) + '%로 목표 ' + Math.round(target*100) + '% 근처를 유지하고 있어요.'};
    }
  }
  return {course:course, all:all, S:S, st:st, sess:sess, learned:learned, total:all.length,
          cumN:cumN, cumOk:cumOk, cumAcc:rate(cumOk, cumN),
          wkSess:wk.length, wkN:wkN, wkAcc:rate(wkOk, wkN),
          diff:diff, diffName:DIFFS[diff].name, target:target,
          weak:weak, next:next, diagDone:diagDone, last:last, stage:stage};
}

/* ── 화면: 오늘 학습 ── */
function renderKids(){
  const h = ensureHub();
  const cards = h.kids.map(k => {
    const c = courseOf(k);
    if(!c) return '';
    const r = report(k);
    return `<div class="kid">
      <div class="nm">${esc(k.name)}</div>
      <div class="co">${esc(c.name)} · 개념 ${r.learned}/${r.total} 학습</div>
      <div class="row">
        <span class="pill d">난이도 ${r.diffName}</span>
        <span class="pill">이번 주 ${r.wkSess}회</span>
        <span class="pill">${r.cumAcc == null ? '기록 없음' : '정답률 ' + r.cumAcc + '%'}</span>
      </div>
      <button class="btn wide" onclick="start('${k.id}')">학습 시작</button>
    </div>`;
  }).join('');
  $('sc-kids').innerHTML = `
    <div class="kids">${cards}</div>
    <div class="card" style="margin-top:14px">
      <h2>학습자 추가</h2>
      <div class="frow">
        <select class="inp" id="add-course">
          ${Object.keys(CAT).map(k => `<option value="${k}">${esc(CAT[k].name)}</option>`).join('')}
        </select>
        <button class="btn mini" onclick="addKid()">추가</button>
      </div>
      <p class="muted">추가한 뒤 설정 탭에서 이름을 바꿀 수 있습니다. 이름은 이 브라우저에만 저장됩니다.</p>
    </div>
    <div class="card">
      <h2>이 프로그램이 하는 일</h2>
      <ul class="guide">
        <li>이미 아는 것 80~90%에 새 개념 10~20%를 얹어, 정답률 85% 언저리 구간을 계속 유지합니다.</li>
        <li>매 문항마다 아이의 실력값을 갱신해 다음 문항 난이도를 스스로 고릅니다.</li>
        <li>틀린 문항은 바로 재교수 카드로 다시 설명하고, 세션 끝에 '자기 전 5분' 카드 3개를 뽑아 줍니다.</li>
        <li>부모 리포트 탭에서 취약 개념과 다음 학습 준비사항을 확인할 수 있습니다.</li>
      </ul>
    </div>`;
}
function start(kidId){
  const h = ensureHub(), k = h.kids.find(x => x.id === kidId);
  if(!k){ toast('학습자를 찾을 수 없어요'); return; }
  const c = courseOf(k);
  if(!c){ toast('코스 정보가 없어요'); return; }
  location.href = c.page + '?kid=' + encodeURIComponent(k.id);
}
function addKid(){
  const course = $('add-course').value;
  const h = ensureHub();
  h.kids.push({id:newId(), name:(CAT[course] ? CAT[course].label : '학습자'), course:course, diff:0});
  saveHub(h); renderKids(); toast('학습자를 추가했어요');
}

/* ── 화면: 부모 리포트 ── */
function renderParent(){
  const h = ensureHub();
  const blocks = h.kids.map(k => {
    const c = courseOf(k);
    if(!c) return '';
    const r = report(k);
    const weakRows = r.weak.length ? r.weak.map(w => `<tr>

        <td class="muted">${esc(w.sec)}</td>

      </tr>`).join('')

    const nextRows = r.next.length ? r.next.map(n => `<tr>
        <td><b>${esc(n.title)}</b></td>
        <td class="muted">${esc(n.sec)}</td>
        <td>${esc(n.tip || '-')}</td>
      </tr>`).join('')
      : '<tr><td colspan="3" class="muted">이 코스의 개념을 모두 한 번씩 학습했습니다. 오답 개념을 반복하는 단계입니다.</td></tr>';
    const sessRows = r.sess.slice(-5).reverse().map(s => `<tr>
        <td>${esc(s.d)}</td><td>${esc(s.mode)}</td>
        <td class="num">${s.ok}/${s.n}</td><td class="num">${rate(s.ok, s.n)}%</td>
      </tr>`).join('') || '<tr><td colspan="4" class="muted">기록이 없습니다</td></tr>';
    const need = r.wkSess >= 3 ? '이번 주 목표를 채웠습니다.' : `이번 주 ${r.wkSess}회 했습니다. ${3 - r.wkSess}회 더 하면 좋습니다.`;
    return `<div class="card">
      <h2>${esc(k.name)} · ${esc(c.name)}</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${r.wkSess}</div><div class="k">이번 주 세션</div></div>
        <div class="kpi"><div class="v">${r.wkN}</div><div class="k">이번 주 문항</div></div>
        <div class="kpi"><div class="v">${r.wkAcc == null ? '-' : r.wkAcc + '%'}</div><div class="k">이번 주 정답률</div></div>
        <div class="kpi"><div class="v">${r.learned}</div><div class="k">학습한 개념 (총 ${r.total})</div></div>
      </div>
      <div class="state ${r.stage.k === 'none' ? '' : r.stage.k}">${esc(r.stage.t)}</div>

      <h3>지금 짚어줄 개념</h3>
      <div class="tblwrap"><table><tr><th>개념</th><th>단원</th><th>정답률</th><th>집에서 해줄 것</th></tr>${weakRows}</table></div>

      <h3>다음에 배울 개념</h3>
      <div class="tblwrap"><table><tr><th>개념</th><th>단원</th><th>미리 해두면 좋은 것</th></tr>${nextRows}</table></div>

      <h3>이번 주 준비사항</h3>
      <p class="muted" style="margin-bottom:8px">${esc(need)} 난이도는 '${r.diffName}'(목표 정답률 ${Math.round(r.target*100)}%)입니다.${r.last ? ' 마지막 학습 ' + esc(r.last) + '.' : ''}</p>
      <ul class="guide">${c.guide.map(g => `<li>${esc(g)}</li>`).join('')}</ul>

      <h3>최근 세션</h3>
      <div class="tblwrap"><table><tr><th>날짜</th><th>종류</th><th>정답</th><th>정답률</th></tr>${sessRows}</table></div>
    </div>`;
  }).join('');
  $('sc-parent').innerHTML = blocks + `<div class="card">
      <h2>읽는 법</h2>
      <ul class="guide">
        <li>목표 정답률 85%는 '너무 쉽지도 어렵지도 않은' 구간입니다. 이 구간에서 학습 속도가 가장 빠릅니다.</li>
        <li>정답률이 목표보다 5%p 이상 높으면 난이도를 올리고, 15%p 이상 낮으면 내리는 것이 좋습니다.</li>
        <li>'지금 짚어줄 개념'은 두 번 이상 틀린 개념입니다. 표의 '집에서 해줄 것' 한 줄만 해주면 충분합니다.</li>
        <li>'다음에 배울 개념'은 아이가 아직 한 번도 풀지 않은 개념입니다. 미리 알려주지 말고, 표의 준비만 해주세요.</li>
      </ul>
    </div>`;
}

/* ── 화면: 설정 ── */
function renderSet(){
  const h = ensureHub();
  const rows = h.kids.map(k => `<div class="frow">
      <input class="inp" value="${esc(k.name)}" onchange="renameKid('${k.id}', this.value)" maxlength="12">
      <span class="pill">${esc((courseOf(k) || {}).label || k.course)}</span>
      <button class="btn mini ghost" onclick="delKid('${k.id}')">삭제</button>
    </div>`).join('');
  $('sc-set').innerHTML = `
    <div class="card">
      <h2>학습자 이름</h2>
      ${rows}
      <p class="muted">이름은 이 브라우저에만 저장됩니다. 다른 기기에는 아래 '설정 옮기기'로 복사해 주세요.</p>
    </div>
    <div class="card">
      <h2>기기 간 설정 옮기기</h2>
      <p class="muted" style="margin-bottom:8px">학습 기록은 기기마다 따로 저장됩니다. 학습자 이름·난이도 설정만 아래 방법으로 옮길 수 있습니다.</p>
      <button class="btn mini" onclick="copyCfg()">설정 복사</button>
      <button class="btn mini ghost" onclick="pasteCfg()">설정 붙여넣기</button>
      <textarea class="inp" id="cfg" style="margin-top:10px" placeholder="여기에 설정 JSON을 붙여넣고 '설정 붙여넣기'를 누르세요"></textarea>
    </div>
    <div class="card">
      <h2>기록 삭제</h2>
      <p class="muted" style="margin-bottom:8px">이 브라우저에 저장된 학습자와 학습 기록을 모두 지웁니다. 되돌릴 수 없습니다.</p>
      <button class="btn mini ghost" onclick="wipe()">전체 초기화</button>
    </div>`;
}
function renameKid(id, name){
  const n = (name || '').trim().slice(0, 12);
  if(!n) return;
  const h = ensureHub(), k = h.kids.find(x => x.id === id);
  if(k){ k.name = n; saveHub(h); toast('이름을 바꿨어요'); }
}
function delKid(id){
  const h = ensureHub(), k = h.kids.find(x => x.id === id);
  if(!k) return;
  if(!confirm(k.name + ' 학습자와 기록을 지울까요?')) return;
  const c = courseOf(k);
  try{ if(c) localStorage.removeItem(c.store + '_state_v1_' + k.id); }catch(e){}
  h.kids = h.kids.filter(x => x.id !== id);
  saveHub(h); renderKids(); toast('삭제했어요');
}
function copyCfg(){
  const h = ensureHub();
  const cfg = JSON.stringify({kids:h.kids});
  $('cfg').value = cfg;
  try{ navigator.clipboard.writeText(cfg); toast('설정을 복사했어요'); }
  catch(e){ toast('아래 칸의 내용을 복사해 주세요'); }
}
function pasteCfg(){
  try{
    const o = JSON.parse($('cfg').value);
    if(!o || !Array.isArray(o.kids) || !o.kids.length) throw 0;
    const h = ensureHub();
    o.kids.forEach(nk => {
      const cur = h.kids.find(x => x.id === nk.id);
      if(cur){ cur.name = nk.name; cur.diff = nk.diff | 0; }
      else h.kids.push({id:nk.id, name:nk.name, course:nk.course, diff:nk.diff | 0});
    });
    saveHub(h); renderKids(); toast('설정을 가져왔어요');
  }catch(e){ toast('설정 형식이 올바르지 않아요'); }
}
function wipe(){
  if(!confirm('학습자와 학습 기록을 모두 지울까요? 되돌릴 수 없습니다.')) return;
  const h = ensureHub();
  h.kids.forEach(k => {
    const c = courseOf(k);
    try{ if(c) localStorage.removeItem(c.store + '_state_v1_' + k.id); }catch(e){}
  });
  try{ localStorage.removeItem(HUBKEY); }catch(e){}
  renderKids(); toast('초기화했어요');
}

/* ── 탭 ── */
function go(t){
  ['kids', 'parent', 'set'].forEach(x => {
    $('sc-' + x).className = (x === t) ? '' : 'hidden';
  });
  document.querySelectorAll('.tab').forEach(b => b.className = (b.dataset.t === t) ? 'tab on' : 'tab');
  if(t === 'parent') renderParent();
  if(t === 'set') renderSet();
  if(t === 'kids') renderKids();
  window.scrollTo(0, 0);
}

/* ── 시작 ── */
ensureHub();
renderKids();
</script>
</body>
</html>
